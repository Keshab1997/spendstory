name: spendstory
description: "SpendStory — UPI & bank SMS expense tracker. English, Hindi, Bengali. 100% on-device."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.5

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # --- state / di + navigation ---
  flutter_riverpod: ^2.6.1
  go_router: ^18.0.0

  # --- persistence ---
  drift: ^2.21.0
  sqlite3_flutter_libs: ^0.5.26
  path_provider: ^2.1.5
  path: ^1.9.0

  # --- platform ---
  # SMS and notification permissions. Every call is guarded in
  # lib/platform/permissions.dart, so the web build and the widget tests are
  # unaffected by the plugin's absence.
  permission_handler: ^13.0.2

  # --- utils ---
  uuid: ^4.5.1
  crypto: ^3.0.6
  intl: ^0.20.2
  collection: ^1.19.0
  google_mobile_ads: ^9.1.0
  in_app_purchase: ^3.3.1
  pointycastle: ^4.0.0
  pdf: ^3.13.1
  share_plus: ^13.3.1
  file_picker: ^13.1.0
  local_auth: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.21.0
  build_runner: ^2.4.13

  # Pinned deliberately. build_runner 2.16.1 *declares* support for analyzer
  # 13.3–15 but its source does not compile against 14.x (`contextFeatures`
  # was removed from AnalysisOptionsImpl). 13.3.x is the newest analyzer that
  # satisfies both build_runner and drift_dev, so codegen runs here. This is a
  # codegen-only pin: it has no effect on the shipped app.
  analyzer: 13.3.0

flutter:
  # Enables flutter gen-l10n: lib/l10n/*.arb -> AppLocalizations (docs/09 §1).
  generate: true
  uses-material-design: true

  # 3D illustrations (T-051). Dark-bg set ships first; the light variants are
  # T-059 and will land in assets/3d/light/ without a widget change.
  assets:
    - assets/3d/

  # Bundled, never fetched. An on-device, offline-first app must not depend on
  # fonts.googleapis.com at runtime — see docs/02-DESIGN-SYSTEM.md §3.
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-VariableFont_wght.ttf
          weight: 400
        - asset: assets/fonts/Manrope-VariableFont_wght.ttf
          weight: 500
        - asset: assets/fonts/Manrope-VariableFont_wght.ttf
          weight: 600
        - asset: assets/fonts/Manrope-VariableFont_wght.ttf
          weight: 700
        - asset: assets/fonts/Manrope-VariableFont_wght.ttf
          weight: 800
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali-VariableFont_wght.ttf
          weight: 400
        - asset: assets/fonts/NotoSansBengali-VariableFont_wght.ttf
          weight: 600
        - asset: assets/fonts/NotoSansBengali-VariableFont_wght.ttf
          weight: 700
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-VariableFont_wght.ttf
          weight: 400
        - asset: assets/fonts/NotoSansDevanagari-VariableFont_wght.ttf
          weight: 600
        - asset: assets/fonts/NotoSansDevanagari-VariableFont_wght.ttf
          weight: 700
